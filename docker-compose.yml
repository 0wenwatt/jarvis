services:
  jarvis-dev:
    build: .
    container_name: jarvis-dev
    networks:
      - jarvis-net
    env_file:
      - .env
    volumes:
      # Workspace (app source code)
      - ./workspace/jarvis:/workspace/jarvis
      - ./.code-server-config:/root/.config/code-server

      # Docker-in-Docker
      - /var/run/docker.sock:/var/run/docker.sock

      # Persistent volumes (created automatically)
      - jarvis-workspaces:/workspace/jarvis/workspaces
      - jarvis-skills:/workspace/jarvis/skills

      # Tailscale node state — persists across restarts so it reconnects
      # automatically without needing a fresh auth key every time.
      - tailscale-state:/var/lib/tailscale

    # Required for Tailscale to create a real tun0 interface (not just the
    # userspace proxy), which is what makes 8443/8000 reachable from other
    # tailnet devices like your phone.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun

    ports:
      # code-server (VSCode in browser)
      - "8443:8443"

      # FastAPI web GUI
      - "8000:8000"

    environment:
      POSTGRES_HOST: postgres-age
      POSTGRES_PORT: 5432
      DOCKER_HOST: unix:///var/run/docker.sock
      AUTHSOME_BASE_URL: http://authsome:7998

    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 512m
          cpus: "0.5"

    restart: unless-stopped
    depends_on:
      postgres-age:
        condition: service_healthy
      authsome:
        condition: service_healthy

    # Interactive TTY for terminal access
    stdin_open: true
    tty: true

    entrypoint: ["/entrypoint.sh"]

  postgres-age:
    # Custom image: apache/age (property graph) + pgvector (vector search)
    build:
      context: ./postgres-age
      dockerfile: Dockerfile
      args:
        PG_MAJOR: "16"
    container_name: postgres-age
    networks:
      - jarvis-net
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jarvis}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      # PG18+ stores data under /var/lib/postgresql/<major>/data — mount the parent
      - postgres-age-data:/var/lib/postgresql
      # Initialisation script: enables age + vector extensions and creates
      # the knowledge graph + chunks table on first container start.
      - ./postgres-age/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-jarvis}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # -------------------------------------------------------
  # Authsome — credential gateway for agents
  # Stores and injects API keys / OAuth tokens at runtime.
  # -------------------------------------------------------
  authsome-postgres:
    image: postgres:16-alpine
    container_name: authsome-postgres
    networks:
      - jarvis-net
    environment:
      POSTGRES_DB: authsome
      POSTGRES_USER: authsome
      POSTGRES_PASSWORD: ${AUTHSOME_POSTGRES_PASSWORD}
    volumes:
      - authsome-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authsome -d authsome"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  authsome-redis:
    image: redis:7-alpine
    container_name: authsome-redis
    networks:
      - jarvis-net
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - authsome-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  authsome:
    build:
      context: ./authsome
      dockerfile: Dockerfile
    container_name: authsome
    networks:
      - jarvis-net
    ports:
      - "7998:7998"
    depends_on:
      authsome-postgres:
        condition: service_healthy
      authsome-redis:
        condition: service_healthy
    volumes:
      - authsome-data:/data/authsome
    environment:
      AUTHSOME_ENV: prod
      AUTHSOME_HOST: 0.0.0.0
      AUTHSOME_PORT: "7998"
      AUTHSOME_BASE_URL: http://localhost:7998
      AUTHSOME_DATABASE_URL: postgresql://authsome:${AUTHSOME_POSTGRES_PASSWORD}@authsome-postgres:5432/authsome
      AUTHSOME_REDIS_URL: redis://authsome-redis:6379/0
      AUTHSOME_MASTER_KEY: ${AUTHSOME_MASTER_KEY}
      AUTHSOME_UI_SESSION_KEY: ${AUTHSOME_UI_SESSION_KEY}
      AUTHSOME_DO_NOT_TRACK: "1"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:7998/health')\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

networks:
  jarvis-net:
    driver: bridge

volumes:
  postgres-age-data:
  jarvis-workspaces:
  jarvis-skills:
  tailscale-state:
  authsome-postgres-data:
  authsome-redis-data:
  authsome-data: